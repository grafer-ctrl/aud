<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisa Teknikal AUD/USD - VWAP, 3 EMA & MACD Pro</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #15161b;
      --text-main: #ffffff;
      --text-muted: #888888;
      --mt-green: #00bc3f;
      --chart-bg: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace, sans-serif;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background-color: var(--card-bg);
      border: 1px solid #333;
      border-radius: 4px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    header {
      margin-bottom: 15px;
      border-bottom: 1px dashed #444;
      padding-bottom: 10px;
    }

    h1 {
      font-size: 1.3rem;
      color: var(--mt-green);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .status-badge {
      font-weight: bold;
    }

    .status-live {
      color: #00ff00;
    }

    .status-demo {
      color: #ffaa00;
    }

    .chart-container {
      position: relative;
      background-color: var(--chart-bg);
      border: 2px solid #222;
      margin-bottom: 20px;
      width: 100%;
      height: 560px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .button-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-top: 10px;
    }

    .btn-mql {
      background-color: #ffffff;
      color: #000000;
      border: 3px solid #000000;
      font-weight: 900;
      font-size: 13px;
      padding: 8px 15px;
      cursor: pointer;
      text-transform: uppercase;
      flex: 1;
      min-width: 120px;
      text-align: center;
      transition: all 0.15s ease-in-out;
    }

    .btn-mql:hover {
      background-color: var(--mt-green);
      color: #ffffff;
    }

    .btn-mql.active {
      background-color: var(--mt-green);
      color: #ffffff;
    }

    .signal-box {
      background: #20222a;
      border-left: 4px solid var(--mt-green);
      padding: 10px;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .signal-text {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AUD/USD Technical Suite (VWAP + 3 EMA + MACD PRO)</h1>
      <div class="status-bar">
        <div>Asset: <span id="current-asset" style="color: #fff;">AUD/USD</span> (<span id="current-tf">H1</span>)</div>
        <div>Sumber Data: <span id="data-status" class="status-badge status-live">Menghubungkan...</span></div>
      </div>
    </header>

    <div class="signal-box">
      <span>Status Tren AUD/USD: </span>
      <span id="signal-state" class="signal-text">Memproses...</span>
    </div>

    <div class="chart-container">
      <canvas id="forexChart"></canvas>
    </div>

    <div class="button-container">
      <button class="btn-mql active" style="cursor: default;">AUD/USD (FOCUS)</button>
      <button id="btn-tf" class="btn-mql" onclick="toggleTimeframe()">TIMEFRAME: H1</button>
      <button id="btn-refresh" class="btn-mql" onclick="fetchData()">REFRESH API</button>
    </div>
  </div>

  <script>
    const apiKey = '68c36795a75a4b9c99e8ea500b7e5937';
    const currentSymbol = 'AUD/USD'; // Pair difokuskan hanya AUD/USD
    let currentInterval = '1h';
    let rawCandles = [];
    
    // Timeframe rotasi
    const timeframes = [
      { display: 'H1', value: '1h' },
      { display: 'H4', value: '4h' },
      { display: 'D1', value: '1day' },
      { display: 'M15', value: '15min' },
      { display: 'M30', value: '30min' }
    ];
    let currentTfIndex = 0;

    // Parameter Teknis MQL
    const InpEMA1 = 9;
    const InpEMA2 = 12;
    const InpEMA3 = 26;
    const InpEMAFilter = 200;

    const FastMACD = 12;
    const SlowMACD = 26;

    const DevMults = [0.5, 1.0, 1.5, 2.0, 2.5];

    function toggleTimeframe() {
      currentTfIndex = (currentTfIndex + 1) % timeframes.length;
      const tf = timeframes[currentTfIndex];
      currentInterval = tf.value;
      document.getElementById('btn-tf').innerText = 'TIMEFRAME: ' + tf.display;
      document.getElementById('current-tf').innerText = tf.display;
      fetchData();
    }

    async function fetchData() {
      const statusElement = document.getElementById('data-status');
      statusElement.className = 'status-badge';
      statusElement.innerText = 'Mengunduh...';
      
      const url = `https://api.twelvedata.com/time_series?symbol=${currentSymbol}&interval=${currentInterval}&apikey=${apiKey}&outputsize=250`;

      try {
        const response = await fetch(url);
        const json = await response.json();

        if (json.status === 'ok' && json.values) {
          rawCandles = json.values.map(d => ({
            time: d.datetime,
            open: parseFloat(d.open),
            high: parseFloat(d.high),
            low: parseFloat(d.low),
            close: parseFloat(d.close),
            volume: parseFloat(d.volume) || 1
          })).reverse();

          statusElement.innerText = 'LIVE API';
          statusElement.classList.add('status-live');
          processAndDraw();
        } else {
          throw new Error(json.message || 'Pembatasan API');
        }
      } catch (err) {
        console.warn('API error, menggunakan simulasi demo AUD/USD:', err.message);
        statusElement.innerText = 'DEMO DATA (Limit API)';
        statusElement.classList.add('status-demo');
        rawCandles = generateDemoData();
        processAndDraw();
      }
    }

    // Generator simulasi harga spesifik range AUD/USD (~0.65500)
    function generateDemoData() {
      const data = [];
      let price = 0.65500;
      let date = new Date();
      for (let i = 0; i < 250; i++) {
        const change = (Math.random() - 0.495) * 0.0010; 
        const open = price;
        const close = price + change;
        const high = Math.max(open, close) + Math.random() * 0.0004;
        const low = Math.min(open, close) - Math.random() * 0.0004;
        const volume = Math.floor(Math.random() * 400) + 100;
        
        data.push({
          time: date.toISOString().replace('T', ' ').substring(0, 19),
          open, high, low, close, volume
        });
        price = close;
        date.setHours(date.getHours() - 1);
      }
      return data.reverse();
    }

    // Perhitungan EMA
    function calculateEMA(data, period) {
      const ema = [];
      const k = 2 / (period + 1);
      let prevEma = null;

      for (let i = 0; i < data.length; i++) {
        if (data[i] === null || isNaN(data[i])) {
          ema.push(null);
          continue;
        }
        if (prevEma === null) {
          const validSegment = data.slice(Math.max(0, i - period + 1), i + 1).filter(v => v !== null && !isNaN(v));
          if (validSegment.length < period && i < period - 1) {
            ema.push(null);
          } else {
            prevEma = validSegment.reduce((s, v) => s + v, 0) / validSegment.length;
            ema.push(prevEma);
          }
        } else {
          const curEma = data[i] * k + prevEma * (1 - k);
          ema.push(curEma);
          prevEma = curEma;
        }
      }
      return ema;
    }

    // Perhitungan VWAP Multi-Layer (Reset Tiap Hari Baru)
    function calculateVWAP(candles) {
      const vwapCenter = new Array(candles.length).fill(null);
      const upperLayers = [[], [], [], [], []];
      const lowerLayers = [[], [], [], [], []];

      for (let i = 0; i < candles.length; i++) {
        const curDate = candles[i].time.substring(0, 10);
        let dayStartBar = i;

        // Cari awal hari
        for (let j = i; j >= 0; j--) {
          if (candles[j].time.substring(0, 10) === curDate) {
            dayStartBar = j;
          } else {
            break;
          }
        }

        let sumPV = 0, sumV = 0, sumPV2 = 0;
        for (let k = dayStartBar; k <= i; k++) {
          const tp = (candles[k].high + candles[k].low + candles[k].close) / 3.0;
          const vol = candles[k].volume > 0 ? candles[k].volume : 1;
          sumPV += tp * vol;
          sumV += vol;
          sumPV2 += tp * tp * vol;
        }

        if (sumV > 0) {
          const vwap = sumPV / sumV;
          let variance = (sumPV2 / sumV) - (vwap * vwap);
          if (variance < 0) variance = 0;
          const stdDev = Math.sqrt(variance);

          vwapCenter[i] = vwap;
          for (let d = 0; d < DevMults.length; d++) {
            upperLayers[d][i] = vwap + (stdDev * DevMults[d]);
            lowerLayers[d][i] = vwap - (stdDev * DevMults[d]);
          }
        } else {
          vwapCenter[i] = null;
          for (let d = 0; d < 5; d++) {
            upperLayers[d][i] = null;
            lowerLayers[d][i] = null;
          }
        }
      }

      return { center: vwapCenter, upper: upperLayers, lower: lowerLayers };
    }

    // Perhitungan MACD Pro
    function calculateMACDPro(closes) {
      const fastMA = calculateEMA(closes, FastMACD);
      const slowMA = calculateEMA(closes, SlowMACD);
      const macdVal = [];

      for (let i = 0; i < closes.length; i++) {
        if (fastMA[i] !== null && slowMA[i] !== null) {
          macdVal.push(fastMA[i] - slowMA[i]);
        } else {
          macdVal.push(null);
        }
      }
      return macdVal;
    }

    function processAndDraw() {
      const closes = rawCandles.map(c => c.close);

      // 1. VWAP Layers
      const vwapData = calculateVWAP(rawCandles);

      // 2. 3 EMA + Filter 200
      const ema9 = calculateEMA(closes, InpEMA1);
      const ema12 = calculateEMA(closes, InpEMA2);
      const ema26 = calculateEMA(closes, InpEMA3);
      const ema200 = calculateEMA(closes, InpEMAFilter);

      // 3. MACD Pro
      const macd = calculateMACDPro(closes);

      // Evaluasi Tren Signal
      const lastIdx = closes.length - 1;
      const e9 = ema9[lastIdx];
      const e12 = ema12[lastIdx];
      const e26 = ema26[lastIdx];
      const mCur = macd[lastIdx];
      const mPrev = macd[lastIdx - 1];

      const signalBox = document.getElementById('signal-state');
      if (e9 && e12 && e26 && e9 > e12 && e12 > e26 && (mCur !== null && mCur >= (mPrev || 0))) {
        signalBox.innerText = 'BULLISH (BUY TREND) 🟢';
        signalBox.style.color = '#00bfff';
      } else if (e9 && e12 && e26 && e9 < e12 && e12 < e26 && (mCur !== null && mCur <= (mPrev || 0))) {
        signalBox.innerText = 'BEARISH (SELL TREND) 🔴';
        signalBox.style.color = '#ff1493';
      } else {
        signalBox.innerText = 'KONSOLIDASI / NETRAL ⚪';
        signalBox.style.color = '#ffd700';
      }

      drawChart(rawCandles, vwapData, { ema9, ema12, ema26, ema200 }, macd);
    }

    function drawChart(candles, vwap, emas, macd) {
      const canvas = document.getElementById('forexChart');
      const ctx = canvas.getContext('2d');

      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const width = rect.width;
      const height = rect.height;

      // Background Hitam
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      const paddingRight = 65;
      const paddingLeft = 10;
      const paddingTop = 25;
      const paddingBottom = 25;
      const gap = 15;

      const totalChartHeight = height - paddingTop - paddingBottom;
      const mainHeight = Math.floor(totalChartHeight * 0.65);
      const subHeight = totalChartHeight - mainHeight - gap;

      const chartYTop = paddingTop;
      const chartYBottom = paddingTop + mainHeight;
      const subYTop = chartYBottom + gap;
      const subYBottom = subYTop + subHeight;

      const plotWidth = width - paddingLeft - paddingRight;

      const maxCandles = 70;
      const totalCandles = candles.length;
      const startIndex = Math.max(0, totalCandles - maxCandles);
      const visibleCount = totalCandles - startIndex;

      const candleWidth = plotWidth / visibleCount;
      const getX = (i) => paddingLeft + (i - startIndex) * candleWidth + candleWidth / 2;

      // 1. Grid Vertikal
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      for (let i = startIndex; i < totalCandles; i++) {
        if ((i - startIndex) % 10 === 0) {
          const x = getX(i);
          ctx.beginPath();
          ctx.moveTo(x, chartYTop);
          ctx.lineTo(x, chartYBottom);
          ctx.moveTo(x, subYTop);
          ctx.lineTo(x, subYBottom);
          ctx.stroke();

          ctx.fillStyle = '#777777';
          ctx.font = '10px monospace';
          ctx.textAlign = 'center';
          const t = candles[i].time;
          const timeStr = t.includes(' ') ? t.split(' ')[1].substring(0, 5) : t.substring(5, 10);
          ctx.fillText(timeStr, x, height - 5);
        }
      }
      ctx.setLineDash([]);

      // 2. Skala Harga Chart Utama
      let minPrice = Infinity;
      let maxPrice = -Infinity;
      for (let i = startIndex; i < totalCandles; i++) {
        const c = candles[i];
        if (c.low < minPrice) minPrice = c.low;
        if (c.high > maxPrice) maxPrice = c.high;

        if (vwap.center[i]) {
          if (vwap.lower[4][i] && vwap.lower[4][i] < minPrice) minPrice = vwap.lower[4][i];
          if (vwap.upper[4][i] && vwap.upper[4][i] > maxPrice) maxPrice = vwap.upper[4][i];
        }
        if (emas.ema200[i]) {
          if (emas.ema200[i] < minPrice) minPrice = emas.ema200[i];
          if (emas.ema200[i] > maxPrice) maxPrice = emas.ema200[i];
        }
      }

      const priceRange = maxPrice - minPrice || 0.001;
      minPrice -= priceRange * 0.03;
      maxPrice += priceRange * 0.03;

      const getMainY = (price) => chartYBottom - ((price - minPrice) / (maxPrice - minPrice)) * mainHeight;

      // Skala Garis Horisontal
      ctx.strokeStyle = '#151515';
      ctx.setLineDash([2, 2]);
      const steps = 5;
      for (let s = 0; s <= steps; s++) {
        const p = minPrice + ((maxPrice - minPrice) * s) / steps;
        const y = getMainY(p);
        ctx.beginPath();
        ctx.moveTo(paddingLeft, y);
        ctx.lineTo(width - paddingRight, y);
        ctx.stroke();

        ctx.fillStyle = '#888888';
        ctx.font = '10px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(p.toFixed(5), width - paddingRight + 5, y + 3);
      }
      ctx.setLineDash([]);

      // 3. Gambar Layer VWAP
      // Upper Layers (DeepSkyBlue)
      ctx.strokeStyle = 'rgba(0, 191, 255, 0.45)';
      ctx.lineWidth = 1;
      for (let d = 0; d < 5; d++) {
        ctx.beginPath();
        for (let i = startIndex; i < totalCandles; i++) {
          if (vwap.upper[d][i] !== null) {
            const x = getX(i);
            const y = getMainY(vwap.upper[d][i]);
            if (i === startIndex || vwap.upper[d][i - 1] === null) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
        }
        ctx.stroke();
      }

      // Lower Layers (Pink)
      ctx.strokeStyle = 'rgba(255, 192, 203, 0.45)';
      for (let d = 0; d < 5; d++) {
        ctx.beginPath();
        for (let i = startIndex; i < totalCandles; i++) {
          if (vwap.lower[d][i] !== null) {
            const x = getX(i);
            const y = getMainY(vwap.lower[d][i]);
            if (i === startIndex || vwap.lower[d][i - 1] === null) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
        }
        ctx.stroke();
      }

      // Main VWAP Center (Kuning)
      ctx.strokeStyle = '#ffff00';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = startIndex; i < totalCandles; i++) {
        if (vwap.center[i] !== null) {
          const x = getX(i);
          const y = getMainY(vwap.center[i]);
          if (i === startIndex || vwap.center[i - 1] === null) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
      }
      ctx.stroke();

      // 4. Candlesticks (MT4 Style)
      for (let i = startIndex; i < totalCandles; i++) {
        const c = candles[i];
        const x = getX(i);
        const w = Math.max(1.5, candleWidth * 0.7);

        const yOpen = getMainY(c.open);
        const yClose = getMainY(c.close);
        const yHigh = getMainY(c.high);
        const yLow = getMainY(c.low);

        const isBullish = c.close >= c.open;
        ctx.strokeStyle = isBullish ? '#00ff00' : '#ffffff';
        ctx.lineWidth = 1.2;

        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();

        if (isBullish) {
          ctx.fillStyle = '#000000';
          ctx.fillRect(x - w / 2, Math.min(yOpen, yClose), w, Math.max(1, Math.abs(yOpen - yClose)));
          ctx.strokeRect(x - w / 2, Math.min(yOpen, yClose), w, Math.max(1, Math.abs(yOpen - yClose)));
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(x - w / 2, Math.min(yOpen, yClose), w, Math.max(1, Math.abs(yOpen - yClose)));
          ctx.strokeRect(x - w / 2, Math.min(yOpen, yClose), w, Math.max(1, Math.abs(yOpen - yClose)));
        }
      }

      // 5. 3 EMA dengan Slope Coloring (DodgerBlue / DeepPink)
      const drawSlopeEMA = (emaArr, widthLine = 2) => {
        ctx.lineWidth = widthLine;
        for (let i = startIndex + 1; i < totalCandles; i++) {
          if (emaArr[i] === null || emaArr[i - 1] === null) continue;
          ctx.beginPath();
          ctx.moveTo(getX(i - 1), getMainY(emaArr[i - 1]));
          ctx.lineTo(getX(i), getMainY(emaArr[i]));
          
          ctx.strokeStyle = emaArr[i] >= emaArr[i - 1] ? '#1e90ff' : '#ff1493';
          ctx.stroke();
        }
      };

      drawSlopeEMA(emas.ema9, 2);
      drawSlopeEMA(emas.ema12, 2);
      drawSlopeEMA(emas.ema26, 2);

      // EMA Filter 200 (Gold)
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.beginPath();
      let filterStarted = false;
      for (let i = startIndex; i < totalCandles; i++) {
        if (emas.ema200[i] !== null) {
          const x = getX(i);
          const y = getMainY(emas.ema200[i]);
          if (!filterStarted) {
            ctx.moveTo(x, y);
            filterStarted = true;
          } else {
            ctx.lineTo(x, y);
          }
        }
      }
      ctx.stroke();

      // Label Chart Utama
      ctx.fillStyle = '#00ff00';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('AUD/USD : VWAP 5-LAYERS + EMA (9, 12, 26, 200)', paddingLeft + 10, chartYTop + 15);

      // 6. SUBWINDOW : MACD PRO (Color_MACD_Visual)
      let minMacd = -0.0001;
      let maxMacd = 0.0001;
      for (let i = startIndex; i < totalCandles; i++) {
        if (macd[i] !== null) {
          if (macd[i] < minMacd) minMacd = macd[i];
          if (macd[i] > maxMacd) maxMacd = macd[i];
        }
      }
      const absMax = Math.max(Math.abs(minMacd), Math.abs(maxMacd)) * 1.15;
      const getSubY = (val) => subYTop + subHeight / 2 - (val / absMax) * (subHeight / 2);

      const zeroY = getSubY(0);

      // Garis Nol
      ctx.strokeStyle = '#555555';
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      ctx.moveTo(paddingLeft, zeroY);
      ctx.lineTo(width - paddingRight, zeroY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Label Level Subwindow
      ctx.fillStyle = '#888888';
      ctx.font = '10px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('0.0000', width - paddingRight + 5, zeroY + 3);
      ctx.fillText(absMax.toFixed(5), width - paddingRight + 5, getSubY(absMax) + 3);
      ctx.fillText((-absMax).toFixed(5), width - paddingRight + 5, getSubY(-absMax) + 3);

      // Gambar Histogram MACD Pro
      const barW = Math.max(2, candleWidth * 0.5);
      for (let i = startIndex; i < totalCandles; i++) {
        if (macd[i] === null) continue;
        const prev = i > 0 && macd[i - 1] !== null ? macd[i - 1] : macd[i];
        const isUp = macd[i] >= prev;

        ctx.fillStyle = isUp ? '#00bfff' : '#dc143c';
        const x = getX(i);
        const y = getSubY(macd[i]);
        const h = zeroY - y;

        ctx.fillRect(x - barW / 2, Math.min(zeroY, y), barW, Math.max(1, Math.abs(h)));
      }

      // Gambar Garis MACD Pro Slope
      ctx.lineWidth = 2;
      for (let i = startIndex + 1; i < totalCandles; i++) {
        if (macd[i] === null || macd[i - 1] === null) continue;
        const isUp = macd[i] >= macd[i - 1];
        ctx.strokeStyle = isUp ? '#00ffff' : '#ffb6c1';

        ctx.beginPath();
        ctx.moveTo(getX(i - 1), getSubY(macd[i - 1]));
        ctx.lineTo(getX(i), getSubY(macd[i]));
        ctx.stroke();
      }

      // Label Window
      ctx.fillStyle = '#00ff00';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('WINDOW : MACD PRO (12, 26)', paddingLeft + 10, subYTop + 15);

      // Garis Pembatas Chart & Subwindow
      ctx.strokeStyle = '#333333';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, chartYBottom + gap / 2);
      ctx.lineTo(width, chartYBottom + gap / 2);
      ctx.stroke();
    }

    window.addEventListener('resize', () => {
      if (rawCandles.length > 0) processAndDraw();
    });

    fetchData();
  </script>
</body>
</html>
